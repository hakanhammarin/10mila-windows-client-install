<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@TITLE@</title>
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI", Arial, sans-serif; background: @BG@ url("@IMAGE@") no-repeat center @IMGPOS@ / @IMGSIZE@;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 8vh; box-sizing: border-box;
  }
  h1 { font-size: 1.1rem; font-weight: 600; color: #333; margin: 0 0 1rem; letter-spacing: .02em; }
  nav { display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; max-width: 900px; padding: 0 16px; }
  a {
    display: block; min-width: 10rem; padding: .9rem 1.2rem; border-radius: .6rem; text-align: center; text-decoration: none;
    font-size: 1.05rem; font-weight: 600; color: #fff; background: @ACCENT@; box-shadow: 0 2px 6px rgba(0,0,0,.18);
  }
  a:hover, a:focus { filter: brightness(1.12); outline: 3px solid #222; outline-offset: 2px; }
  a.general { background: #444; }
</style>
</head>
<body>
  <h1>@COMPUTER@</h1>
  <nav>
@LINKS@
  </nav>
</body>
</html>
